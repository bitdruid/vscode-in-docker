name: build-push
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'


# Ensure only one build-push workflow runs at a time for the main branch.
concurrency:
  group: build-push
  cancel-in-progress: true

jobs:
  dockerhub:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    env:
      # Fixed name: github.event.repository is empty for scheduled runs.
      IMAGE: ${{ secrets.DOCKERHUB_USER }}/vscode-in-docker
    permissions:
      contents: read
      actions: write   # needed to delete old workflow runs
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest

      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./README.md

      - name: Prune old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/actions/workflows/build-push.yml/runs" \
            -q '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id' \
          | while read -r id; do
              echo "Deleting run $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id"
            done