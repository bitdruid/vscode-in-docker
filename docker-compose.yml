services:
  vscode:
    build: .
    container_name: vscode
    ports:
      - "5800:5800"
      - "5900:5900"
    volumes:
      - vscode-home:/home/app   # user's home: settings, extensions, projects
      - vscode-config:/config   # base image state (logs, certs, web auth)
    environment:
      - TZ=Europe/Berlin
      - USER_ID=1000
      - GROUP_ID=1000
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
      - KEEP_APP_RUNNING=1
      - WEB_FILE_MANAGER=1
      - WEB_FILE_MANAGER_ALLOWED_PATHS=/home/app
      - AUTO_UPDATE=1   # update VS Code on container start
      # - VSCODE_OPEN=/home/app/workspace   # always open this folder on start
      # - VNC_PASSWORD=secret
    restart: unless-stopped
    shm_size: 256m

volumes:
  vscode-home:
  vscode-config:
